media:
  input: static/images
  output: /images

content:
  - name: posts
    label: 文章管理
    type: collection
    path: content/posts
    format: toml-frontmatter

    filename:
    template: "{year}-{month}-{day}-{fields.slug}.md"
    field: create

    view:
      primary: title
      fields: [title, date, draft]
      sort: [date]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"

      - name: slug
        label: 文章标识
        type: string
        required: true
        description: "使用英文小写字母、数字和连字符，例如 unity-object-access"
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

      - name: draft
        label: 草稿
        type: boolean
        default: false

      - name: description
        label: 文章摘要
        type: text

      - name: categories
        label: 分类
        type: string
        list: true

      - name: tags
        label: 标签
        type: string
        list: true

      - name: body
        label: 正文
        type: rich-text
